name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, unit + contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  integration:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:int
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-coverage
          path: coverage/integration/
          retention-days: 7

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  eval:
    name: LLM evals (brief agent on Claude)
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Require the Anthropic API key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add the ANTHROPIC_API_KEY repository secret (Settings → Secrets and variables → Actions). See README → LLM evals."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm eval

  dataforseo-smoke:
    name: DataForSEO smoke check (real API)
    runs-on: ubuntu-latest
    env:
      DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
      DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
      # Optional repository variable, e.g. https://sandbox.dataforseo.com for the free Sandbox.
      DATAFORSEO_BASE_URL: ${{ vars.DATAFORSEO_BASE_URL }}
    steps:
      - name: Require the DataForSEO API credentials
        run: |
          if [ -z "$DATAFORSEO_LOGIN" ] || [ -z "$DATAFORSEO_PASSWORD" ]; then
            echo "::error::Add the DATAFORSEO_LOGIN and DATAFORSEO_PASSWORD repository secrets (Settings → Secrets and variables → Actions). See README → SEO module."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm smoke:keywords

  zernio-smoke:
    name: Zernio smoke check (real API)
    runs-on: ubuntu-latest
    env:
      ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
    steps:
      - name: Require the Zernio API key
        run: |
          if [ -z "$ZERNIO_API_KEY" ]; then
            echo "::error::Add the ZERNIO_API_KEY repository secret (Settings → Secrets and variables → Actions). See README → Social module."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm smoke:social

  blogs-smoke:
    name: Blog platforms smoke check (real APIs)
    runs-on: ubuntu-latest
    env:
      # Each platform is checked once its test account is added; until then the check skips.
      SHOPIFY_STORE_URL: ${{ vars.SHOPIFY_STORE_URL }}
      SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
      WEBFLOW_SITE_URL: ${{ vars.WEBFLOW_SITE_URL }}
      WEBFLOW_COLLECTION_ID: ${{ vars.WEBFLOW_COLLECTION_ID }}
      WEBFLOW_API_TOKEN: ${{ secrets.WEBFLOW_API_TOKEN }}
      WIX_SITE_URL: ${{ vars.WIX_SITE_URL }}
      WIX_SITE_ID: ${{ vars.WIX_SITE_ID }}
      WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm smoke:blogs

  e2e-stripe:
    name: E2E against Stripe test mode
    runs-on: ubuntu-latest
    env:
      RAW_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      # The production configuration drafts with Claude, so it needs the key to start.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # This journey never researches keywords; the production config only needs them present.
      DATAFORSEO_LOGIN: unused-in-the-stripe-journey
      DATAFORSEO_PASSWORD: unused-in-the-stripe-journey
      # Nor does it post to social accounts.
      ZERNIO_API_KEY: unused-in-the-stripe-journey
      DATABASE_URL: postgres://nuvantre:nuvantre@localhost:5432/nuvantre
      APP_URL: http://localhost:3000
      BILLING_PROVIDER: stripe
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nuvantre
          POSTGRES_PASSWORD: nuvantre
          POSTGRES_DB: nuvantre
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nuvantre" --health-interval 5s --health-retries 10
    steps:
      - name: Generate an encryption key for this run
        run: |
          key="$(openssl rand -base64 32)"
          echo "::add-mask::$key"
          echo "TOKEN_ENCRYPTION_KEY=$key" >> "$GITHUB_ENV"
      - name: Require a Stripe test-mode key
        # Strips whitespace pasted along with the secret, then exports the cleaned key. On a wrong
        # kind of key it names only the non-secret prefix (e.g. pk_test_ or sk_live_).
        run: |
          key="$(printf '%s' "$RAW_STRIPE_SECRET_KEY" | tr -d '[:space:]')"
          if [ -z "$key" ]; then
            echo "::error::Add the STRIPE_SECRET_KEY repository secret (a sk_test_… key). See README → Billing."
            exit 1
          fi
          case "$key" in
            sk_test_*|rk_test_*)
              echo "::add-mask::$key"
              echo "STRIPE_SECRET_KEY=$key" >> "$GITHUB_ENV"
              exit 0
              ;;
          esac
          kind="$(printf '%s' "$key" | grep -oE '^(sk|pk|rk)_(test|live)_' || true)"
          echo "::error::STRIPE_SECRET_KEY must be a test-mode secret key starting with sk_test_. The secret holds ${kind:-a value in an unrecognised format}${kind:+… key}."
          exit 1
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Install the Stripe CLI
        run: |
          curl -s https://packages.stripe.dev/api/security/keypair/stripe-cli-gpg/public | gpg --dearmor | sudo tee /usr/share/keyrings/stripe.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/stripe.gpg] https://packages.stripe.dev/stripe-cli-debian-local stable main" | sudo tee /etc/apt/sources.list.d/stripe.list
          sudo apt-get update && sudo apt-get install -y stripe
      - run: pnpm stripe:setup
      - run: pnpm db:migrate
      - name: Forward Stripe webhooks to the app
        run: |
          webhook_secret="$(stripe listen --api-key "$STRIPE_SECRET_KEY" --print-secret)"
          echo "::add-mask::$webhook_secret"
          echo "STRIPE_WEBHOOK_SECRET=$webhook_secret" >> "$GITHUB_ENV"
          nohup stripe listen --api-key "$STRIPE_SECRET_KEY" \
            --events checkout.session.completed,customer.subscription.updated,customer.subscription.deleted \
            --forward-to localhost:3000/api/billing/webhook > stripe-listen.log 2>&1 &
      - name: Build and start the web app
        run: |
          pnpm build
          nohup pnpm --filter @nuvantre/web start > web.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/health && exit 0; sleep 2; done
          cat web.log; exit 1
      - run: pnpm test:e2e:stripe
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-stripe-report
          path: |
            playwright-report/
            web.log
            stripe-listen.log
          retention-days: 7
