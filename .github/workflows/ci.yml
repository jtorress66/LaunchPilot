name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, unit + contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  integration:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:int
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-coverage
          path: coverage/integration/
          retention-days: 7

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  e2e-stripe:
    name: E2E against Stripe test mode
    runs-on: ubuntu-latest
    env:
      RAW_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      DATABASE_URL: postgres://launchpilot:launchpilot@localhost:5432/launchpilot
      APP_URL: http://localhost:3000
      BILLING_PROVIDER: stripe
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: launchpilot
          POSTGRES_PASSWORD: launchpilot
          POSTGRES_DB: launchpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U launchpilot" --health-interval 5s --health-retries 10
    steps:
      - name: Require a Stripe test-mode key
        # Strips whitespace pasted along with the secret, then exports the cleaned key. On a wrong
        # kind of key it names only the non-secret prefix (e.g. pk_test_ or sk_live_).
        run: |
          key="$(printf '%s' "$RAW_STRIPE_SECRET_KEY" | tr -d '[:space:]')"
          if [ -z "$key" ]; then
            echo "::error::Add the STRIPE_SECRET_KEY repository secret (a sk_test_… key). See README → Billing."
            exit 1
          fi
          case "$key" in
            sk_test_*|rk_test_*)
              echo "::add-mask::$key"
              echo "STRIPE_SECRET_KEY=$key" >> "$GITHUB_ENV"
              exit 0
              ;;
          esac
          kind="$(printf '%s' "$key" | grep -oE '^(sk|pk|rk)_(test|live)_' || true)"
          echo "::error::STRIPE_SECRET_KEY must be a test-mode secret key starting with sk_test_. The secret holds ${kind:-a value in an unrecognised format}${kind:+… key}."
          exit 1
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Install the Stripe CLI
        run: |
          curl -s https://packages.stripe.dev/api/security/keypair/stripe-cli-gpg/public | gpg --dearmor | sudo tee /usr/share/keyrings/stripe.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/stripe.gpg] https://packages.stripe.dev/stripe-cli-debian-local stable main" | sudo tee /etc/apt/sources.list.d/stripe.list
          sudo apt-get update && sudo apt-get install -y stripe
      - run: pnpm stripe:setup
      - run: pnpm db:migrate
      - name: Forward Stripe webhooks to the app
        run: |
          webhook_secret="$(stripe listen --api-key "$STRIPE_SECRET_KEY" --print-secret)"
          echo "::add-mask::$webhook_secret"
          echo "STRIPE_WEBHOOK_SECRET=$webhook_secret" >> "$GITHUB_ENV"
          nohup stripe listen --api-key "$STRIPE_SECRET_KEY" \
            --events checkout.session.completed,customer.subscription.updated,customer.subscription.deleted \
            --forward-to localhost:3000/api/billing/webhook > stripe-listen.log 2>&1 &
      - name: Build and start the web app
        run: |
          pnpm build
          nohup pnpm --filter @launchpilot/web start > web.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/health && exit 0; sleep 2; done
          cat web.log; exit 1
      - run: pnpm test:e2e:stripe
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-stripe-report
          path: |
            playwright-report/
            web.log
            stripe-listen.log
          retention-days: 7
