# Local development database: `pnpm db:up`, then `pnpm db:migrate`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nuvantre
      POSTGRES_PASSWORD: nuvantre
      POSTGRES_DB: nuvantre
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuvantre"]
      interval: 5s
      retries: 10

volumes:
  postgres-data:
